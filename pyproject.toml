[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlght-ai"
version = "0.1.3"
description = "The workflow runtime layer between your application and any LLM provider."
requires-python = ">=3.11"
readme = "README.md"
license = "LicenseRef-nlght-ai"
license-files = ["LICENSE"]
authors = [
  { name = "Amphidrom GmbH", email = "info@amphidrom.ai" }
]
keywords = [
  "llm",
  "ai",
  "workflow",
  "ollama",
  "openai",
  "anthropic",
  "gemini",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2",
  "asyncpg>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "alembic>=1.13.0",
  "httpx2>=2.5.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pygments>=2.18.0",
  "pathspec>=0.12.1",
  # >=50 is a security floor, not a preference: 49.x carries PYSEC-2026-3552
  # (PKCS#7 decryption oracle), fixed in 50.0.0.
  "cryptography>=50.0.0",
  "tzdata>=2026.2"
]

[project.optional-dependencies]
docker = [
  "docker>=7.0.0",
]
web-search = [
  "beautifulsoup4>=4.12.0",
]
hive-mind = [
  "aiofiles>=23.0.0",
]
nlp = [
  "spacy>=3.7.0",
]
anthropic = [
  "anthropic>=0.40.0",
]
openai = [
  "openai>=1.50.0",
]
google = [
  "google-genai>=1.0.0",
]
metrics = [
  "prometheus-client>=0.20.0",
]
lexical-store = [
  "opensearch-py>=2.0.0",
]
vector-store = [
  "qdrant-client>=1.9.0",
]
embedding = [
  "sentence-transformers>=3.0.0",
]
# Which torch build the embedding model runs on. `embedding` alone resolves torch
# from PyPI, whose default wheel differs per platform — CPU-only on Windows, a
# CUDA build on Linux — so "install the embedding extra" does not say what you
# get. These two say it. Each pins torch to one of PyTorch's own indexes; pick
# one beside `embedding`:
#
#   uv sync --extra embedding --extra embedding-cuda
#   uv sync --extra embedding --extra embedding-cpu
#
# They are mutually exclusive (declared under [tool.uv]) and deliberately absent
# from `all`: an accelerator build is a property of the machine, not a capability
# of the platform, and folding a multi-gigabyte CUDA wheel into `all` would make
# the everything-extra unusable for everyone without a GPU.
embedding-cuda = [
  "sentence-transformers>=3.0.0",
  "torch>=2.0.0",
]
embedding-cpu = [
  "sentence-transformers>=3.0.0",
  "torch>=2.0.0",
]
pdf = [
  "pdfminer.six>=20231228",
]
stores = [
  "opensearch-py>=2.0.0",
  "qdrant-client>=1.9.0",
]
all = [
  "nlght-ai[docker,web-search,hive-mind,nlp,anthropic,openai,google,metrics,stores,embedding,pdf]",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytestarch>=4.0.1",
  "types-PyYAML>=6.0.0",
  "types-Pygments>=2.18.0",
  "anybadge>=1.14.0",
  "bandit[sarif]>=1.7.9",
  "pip-audit>=2.7.0",
  "nlght-ai[all]",
]

[project.scripts]
nlght-ai = "nlght.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nlght*"]

[tool.setuptools.package-data]
"nlght" = [
  "adapters/inbound/http/admin/templates/**/*.html",
  "adapters/inbound/http/admin/static/*",
  "alembic.ini",
  "knowledge_alembic.ini",
  "knowledge_migrations/*",
  "knowledge_migrations/versions/*.py",
  "py.typed",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." puts the standalone review backend on the path; it is a service beside
# the package, not part of it.
pythonpath = ["src", "tests", "."]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  # local_e2e needs a live local Ollama daemon; external_corpus depends on
  # fixtures outside this repository. Both are opt-in.
  "-m", "not local_e2e and not external_corpus",
]
markers = [
  "architecture: architectural dependency tests",
  "integration: tests with external systems",
  "e2e: end-to-end tests",
  "local_e2e: e2e against a live local Ollama daemon (local-only; excluded by default)",
  "external_corpus: assertions against test data stored outside this repository (opt-in)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]
force-exclude = true
exclude = [
  "build",
  ".venv",
  "venv",
  "next-integration",
]

[tool.ruff.lint]
# ANN401: no bare `Any` in signatures (reasoned per-line noqa for dynamic
# construction seams). PLC0415: imports at file top (reasoned per-line noqa
# for optional-extra / lazy-import sites).
select = ["E", "F", "I", "UP", "B", "ANN401", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Function-level imports are idiomatic in tests (importorskip-gated modules,
# fixture-local heavy imports); the top-level-import rule applies to src only.
"tests/**" = ["PLC0415"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true

# Optional-extra third-party packages with no bundled type stubs. Unlike
# `pyyaml` (a required base dependency -- see the types-PyYAML dev dep
# above), these are only ever installed via `pip install nlght-ai[extra]`,
# so we can't require stubs for them without forcing every extra into the
# dev environment just to typecheck. `follow_imports = "skip"` keeps the
# result identical whether or not an extra happens to be installed —
# otherwise mypy follows installed packages into their transitive stubs
# (e.g. spacy → numpy, whose PEP 695 stubs don't parse under
# python_version 3.11) and the outcome depends on the local venv.
[[tool.mypy.overrides]]
module = [
  "docker.*",
  "opensearchpy.*",
  "qdrant_client.*",
  "spacy.*",
  "anthropic.*",
  "openai.*",
  "google.*",
  "prometheus_client.*",
  "bs4.*",
  "ifaddr.*",
  "sentence_transformers.*",
  # Reached by the embedding adapter to ask which accelerator is usable. Same
  # reason as spacy above: following it lands in numpy's PEP 695 stubs.
  "torch.*",
  "pdfminer.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["src/nlght"]

[tool.coverage.report]
show_missing = true
skip_covered = false
omit = [
  # Instrumented debug clients duplicate the regular provider implementations
  # and would double the denominator without adding distinct behaviour.
  "src/nlght/adapters/outbound/model/*_debug.py",
  # Local Ollama e2e requires a daemon and model and intentionally does not run
  # in CI. Cloud provider implementations are measured by their CI e2e suite.
  "src/nlght/adapters/outbound/model/ollama_local.py",
]

[tool.uv]
# One machine has one torch build. Declaring the pair as conflicting is what lets
# the lock carry both resolutions instead of failing to find one that satisfies
# both at once.
conflicts = [
  [
    { extra = "embedding-cuda" },
    { extra = "embedding-cpu" },
  ],
]

# PyTorch publishes its accelerator builds from its own indexes rather than PyPI.
# `explicit = true` keeps them out of resolution for everything else: only the
# packages pointed at them below may come from here.
#
# The CUDA line is part of the URL. Moving to a different one — a newer driver,
# an older card — is a change to this URL and nothing else.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
nlght-ai = { workspace = true }
torch = [
  { index = "pytorch-cu124", extra = "embedding-cuda" },
  { index = "pytorch-cpu", extra = "embedding-cpu" },
]

[project.urls]
Homepage = "https://nlght.ai"
Documentation = "https://nlght.ai/documentation/getting-started/quickstart/"
Repository = "https://github.com/Amphidrom/nlght-ai"
Issues = "https://github.com/Amphidrom/nlght-ai/issues"
Changelog = "https://github.com/Amphidrom/nlght-ai/releases"
